name: CI1 trusted merge gate

# V5 attack: the PR replaces the gate with a job that always passes.
# Same trigger as the real gate, so the PR's copy never runs (pull_request_target uses the base).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: CI1 trusted gate
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0
