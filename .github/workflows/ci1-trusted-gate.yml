name: CI1 trusted merge gate

# CI1.3 T1 trusted gate (charter section 3, MnemeHQ/mneme
# docs/plans/2026-10-17-ci1-3-isolated-merge-blocking-experiment-charter.md).
#
# PROPOSED, NOT APPROVED FOR LIVE USE. While this file exists only on a PR
# branch it cannot run: pull_request_target always uses the workflow file on
# the BASE branch. Merging it to main is a separate approval (charter
# section 9), and the V0-V13 experiment is a further one.
#
# Trust boundary:
# - pull_request_target runs the BASE branch's workflow and gate script with a
#   read-only token. The PR head is fetched into the object store and read only
#   as git blobs; it is never checked out, installed, imported or executed.
# - Decision memory comes from the base commit, never from the PR.
# - The evaluator is the P2-approved build: rebuilt from MnemeHQ/mneme
#   0b74d410 under the recorded conditions and installed only if its sha256 is
#   the approved value. Runtime dependencies are hash-locked.
# - No PR-controlled text (title, body, branch name) is used. The query is fixed.
# The job name below is the required-check context in the proposed ruleset.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci1-trusted-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EVALUATOR_COMMIT: 0b74d410b45e7b3efcf08d00ce58e7bd7017b757
  APPROVED_WHEEL_SHA256: e3fcc769c440ed232ad05117f256739daf233e0c9f6d3d46586adc0de9b48c51
  # From the event, not from anything the PR controls.
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  gate:
    name: CI1 trusted gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the BASE commit (trusted workflow, gate script, memory)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as objects only (never checked out)
        shell: bash
        run: |
          set -euo pipefail
          cd base
          base_sha="$(git rev-parse HEAD)"
          [ "$base_sha" = "$GITHUB_SHA" ] || { echo "::error::base checkout $base_sha != GITHUB_SHA $GITHUB_SHA"; exit 1; }
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/ci1/pr-head"
          fetched="$(git rev-parse refs/ci1/pr-head)"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            # A newer push raced this run; that push triggers its own run.
            echo "::error::PR head moved ($fetched != event $HEAD_SHA); this run is UNEVALUATED"
            exit 1
          fi
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "base $base_sha, head $HEAD_SHA"

      - name: Check out the evaluator source at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MnemeHQ/mneme
          ref: ${{ env.EVALUATOR_COMMIT }}
          path: evaluator-src
          fetch-depth: 1
          persist-credentials: false

      - name: Rebuild the evaluator wheel and require the approved sha256
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          umask 0002
          [ "$(git -C evaluator-src rev-parse HEAD)" = "$EVALUATOR_COMMIT" ] || { echo "::error::evaluator source is not the pinned commit"; exit 1; }
          b="$RUNNER_TEMP/build"
          mkdir -p "$b"
          git -C evaluator-src archive --format=tar HEAD > "$b/src.tar"
          /usr/bin/python3.12 -I -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" "$b/src.tar" "$b/src"
          /usr/bin/python3.12 -I -m venv "$b/venv"
          export SOURCE_DATE_EPOCH="$(git -C evaluator-src log -1 --format=%ct)"
          PIP_CONSTRAINT="$GITHUB_WORKSPACE/base/p2/build-constraints.txt" \
            "$b/venv/bin/python" -I -m pip wheel -q --no-deps --disable-pip-version-check \
            --wheel-dir "$b/built" "$b/src"
          shopt -s nullglob
          wheels=("$b"/built/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected exactly one built wheel, found ${#wheels[@]}"; exit 1; }
          sha="$(sha256sum "${wheels[0]}" | cut -d' ' -f1)"
          [ "$sha" = "$APPROVED_WHEEL_SHA256" ] || { echo "::error::evaluator wheel $sha != approved $APPROVED_WHEEL_SHA256"; exit 1; }
          echo "EVALUATOR_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
          echo "evaluator wheel $sha (approved)"

      - name: Install the pinned evaluator (hash-locked, no resolution)
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          e="$RUNNER_TEMP/evaluator"
          /usr/bin/python3.12 -I -m venv "$e"
          req="$RUNNER_TEMP/evaluator-requirements.txt"
          cp base/gate/evaluator-requirements.txt "$req"
          echo "$EVALUATOR_WHEEL --hash=sha256:$APPROVED_WHEEL_SHA256" >> "$req"
          "$e/bin/python" -I -m pip install -q --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps -r "$req"
          "$e/bin/python" -I -c "import importlib.metadata as m, mneme, sys; p = mneme.__file__; assert p.startswith(sys.prefix), p; print(m.version('mneme-hq'), p)"
          echo "EVALUATOR_PYTHON=$e/bin/python" >> "$GITHUB_ENV"

      - name: Evaluate the PR in the trusted workspace
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gate-out"
          mkdir -p "$out"
          /usr/bin/python3.12 -I base/gate/ci1_gate.py \
            --repo base --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workspace "$RUNNER_TEMP/ws" --venv-python "$EVALUATOR_PYTHON" \
            --empty-dir "$RUNNER_TEMP/empty" --report "$out/gate-report.json"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          /usr/bin/python3.12 -I - "$out/gate-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## CI1 trusted gate\n")
          print(f"- Verdict: **{r['verdict']}**\n- Base `{r['base_sha']}` / head `{r['head_sha']}`")
          ws = r.get("workspace", {})
          if ws:
              print(f"- Trusted memory blob `{ws['memory']['blob']}` from base")
          print("\n| Path | Result |\n|---|---|")
          for x in r.get("results", []):
              print(f"| `{x['path']}` | {x['classification']} |")
          for x in ws.get("refused", []):
              print(f"| `{x['path']}` | REFUSED: {x['reason']} |")
          for p in r.get("problems", []):
              print(f"\n- {p}")
          PY
          exit 0

      - name: Preserve the gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci1-gate-pr${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-out/
          if-no-files-found: error
          retention-days: 90

      - name: Gate decision
        shell: bash
        env:
          GATE_EXIT: ${{ steps.gate.outputs.exit }}
        run: |
          [ "$GATE_EXIT" = "0" ] || { echo "::error::CI1 trusted gate: merge must be blocked (exit ${GATE_EXIT:-none})"; exit 1; }
          echo "CI1 trusted gate: PASS"
