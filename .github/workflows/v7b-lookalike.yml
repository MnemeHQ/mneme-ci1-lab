name: V7b delayed look-alike workflow

# V7b attack: a PR-added pull_request job named EXACTLY like the required
# check ("CI1 trusted gate") that deliberately finishes AFTER the genuine
# gate. Read-only token, no secrets, a delay and an echo only.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lookalike:
    name: CI1 trusted gate
    runs-on: ubuntu-24.04
    steps:
      - run: sleep 120
      - run: echo "V7b delayed look-alike check (always succeeds)"
